apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqi-api-deployment
  labels:
    app: aqi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aqi-api
  template:
    metadata:
      labels:
        app: aqi-api
    spec:
      containers:
        - name: aqi-api
          image: ghcr.io/skit-devops-2026/devops-24eskcs041:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
