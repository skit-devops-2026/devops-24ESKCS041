version: "3.8"

services:
  aqi-api:
    build: .
    image: ghcr.io/skit-devops-2026/devops-24eskcs041:latest
    container_name: aqi-api
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - PORT=5000

  prometheus:
    image: prom/prometheus:latest
    container_name: aqi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aqi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
